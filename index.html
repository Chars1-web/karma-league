<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RKL Sportsbook</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700;800&display=swap" rel="stylesheet">

<style>
:root{
--bg:#040508;
--bg2:#0b0d14;
--card:#11141d;
--border:#1e2431;
--accent:#e8ff3c;
--text:#fff;
--muted:#7f8598;
}

body{
margin:0;
font-family:DM Sans;
background:linear-gradient(var(--bg),var(--bg2));
color:var(--text);
padding:70px 18px;
}

.ticker{
position:fixed;top:0;left:0;width:100%;
height:34px;background:#11141d;
border-bottom:1px solid #1e2431;
overflow:hidden;
display:flex;align-items:center;
}

.ticker-track{
display:flex;gap:60px;
white-space:nowrap;
animation:scroll 20s linear infinite;
padding-left:100%;
}

.ticker-track span{
color:var(--accent);
font-size:11px;
font-weight:800;
}

@keyframes scroll{
0%{transform:translateX(0);}
100%{transform:translateX(-100%);}
}

.hero{text-align:center;margin:30px 0;}
h1{font-family:Bebas Neue;font-size:80px;margin:0;}
h1 span{color:var(--accent);}
.hero-sub{opacity:.6;font-size:12px;letter-spacing:.2em;}

.nav{
max-width:420px;margin:auto;
display:flex;flex-direction:column;gap:14px;
}

.card{
background:var(--card);
border:1px solid var(--border);
padding:20px;
border-radius:14px;
text-decoration:none;
color:white;
display:flex;justify-content:space-between;
}

.card:hover{border-color:var(--accent);}
.title{font-family:Bebas Neue;font-size:32px;}
.sub{font-size:11px;opacity:.6;text-transform:uppercase;}

#profileBox{
position:fixed;top:45px;right:10px;
background:#11141d;
padding:10px;border-radius:10px;
border:1px solid #1e2431;
font-size:12px;
z-index:9999;
}
</style>
</head>

<body>

<div class="ticker">
<div class="ticker-track">
<span>🔥 RKL Betting Live</span>
<span>📊 Player Props Updated</span>
<span>💰 Parlays Available</span>
</div>
</div>

<div id="profileBox">
<button onclick="login()">Profile</button>
<div id="info"></div>
</div>

<div class="hero">
<h1>RKL <span>Sportsbook</span></h1>
<div class="hero-sub">Bet Matchups • Props • Parlays</div>
</div>

<div class="nav">
<a class="card" href="bets.html">
<div>
<div class="title">Bets</div>
<div class="sub">Matchups & Lines</div>
</div>
<div>→</div>
</a>

<a class="card" href="admin.html">
<div>
<div class="title">Admin</div>
<div class="sub">Deposit Approvals</div>
</div>
<div>→</div>
</a>
</div>

<script>
let user = JSON.parse(localStorage.getItem("rklUser")) || null;

function login(){
let u = prompt("Username");
let p = prompt("Password");

user = {username:u,password:p,wallet:user?.wallet||0,pending:user?.pending||0};
localStorage.setItem("rklUser",JSON.stringify(user));
render();
}

function render(){
document.getElementById("info").innerHTML =
user ? `@${user.username}<br>${user.wallet} RAX` : "Not logged in";
}

render();
</script>

</body>
</html>
