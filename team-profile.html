<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RRL Team Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Rubik+Mono+One&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#0a0e27;
    --surface:#141829;
    --border:#2a2d4a;
    --accent:#7c3aed;
    --accent-light:#a78bfa;
    --success:#10b981;
    --danger:#ef4444;
    --warning:#f59e0b;
    --text:#f0f1f5;
    --text-dim:#9ca3af;
}

body{
    font-family:'Space Grotesk',sans-serif;
    background:
        linear-gradient(
            135deg,
            var(--bg) 0%,
            #1a0d1a 100%
        );

    color:var(--text);

    padding:2rem 1rem;

    min-height:100vh;

    background-attachment:fixed;
}

.container{
    max-width:1200px;
    margin:auto;
}

/* HEADER */

header{
    text-align:center;
    margin-bottom:3rem;
}

.team-name{
    font-family:'Rubik Mono One',monospace;

    font-size:3.2rem;

    background:
        linear-gradient(
            135deg,
            var(--accent-light) 0%,
            #ec4899 50%,
            var(--accent) 100%
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    margin-bottom:1rem;

    text-transform:uppercase;
}

.team-record{
    color:var(--warning);

    font-size:1.1rem;

    font-weight:700;

    letter-spacing:1px;
}

/* INFO GRID */

.info-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

    gap:1.5rem;

    margin-bottom:3rem;
}

.info-card{
    background:var(--surface);

    border:2px solid var(--border);

    border-radius:14px;

    padding:2rem 1rem;

    text-align:center;

    transition:0.25s;
}

.info-card:hover{
    border-color:var(--accent);

    transform:translateY(-6px);

    box-shadow:
        0 8px 24px rgba(124,58,237,.2);
}

.info-label{
    color:var(--text-dim);

    font-size:.75rem;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-bottom:1rem;

    font-weight:700;
}

.info-value{
    font-family:'Rubik Mono One',monospace;

    font-size:2.3rem;

    color:var(--accent-light);
}

/* SECTION */

.section-title{
    font-family:'Rubik Mono One',monospace;

    font-size:1.4rem;

    margin-bottom:2rem;

    color:var(--accent-light);

    text-transform:uppercase;
}

/* ROSTER */

.roster-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));

    gap:1rem;
}

.player-card{
    background:var(--surface);

    border:2px solid var(--border);

    border-radius:12px;

    padding:1.3rem;

    text-align:center;

    transition:.25s;

    text-decoration:none;

    color:inherit;

    display:block;
}

.player-card:hover{
    border-color:var(--accent);

    transform:translateY(-5px);

    box-shadow:
        0 8px 20px rgba(124,58,237,.2);
}

.player-card:hover .player-name{
    color:var(--accent-light);
}

.player-name{
    font-weight:700;

    margin-bottom:.45rem;

    transition:.2s;
}

.player-position{
    color:var(--warning);

    font-size:.72rem;

    text-transform:uppercase;

    letter-spacing:1px;
}

/* EMPTY */

.empty-state{
    background:var(--surface);

    border:2px dashed var(--border);

    border-radius:12px;

    padding:3rem;

    text-align:center;

    color:var(--text-dim);
}

/* BUTTONS */

.button-group{
    display:flex;

    gap:1rem;

    flex-wrap:wrap;

    margin-top:3rem;
}

.btn{
    flex:1;

    min-width:160px;

    padding:1rem 1.5rem;

    border-radius:10px;

    border:2px solid var(--border);

    background:var(--surface);

    color:var(--text);

    text-decoration:none;

    text-align:center;

    font-weight:700;

    transition:.25s;
}

.btn:hover{
    border-color:var(--accent);

    color:var(--accent-light);

    transform:translateY(-3px);
}

.btn-primary{
    background:
        linear-gradient(
            135deg,
            var(--accent),
            #ec4899
        );

    border-color:var(--accent);

    color:white;
}

/* MOBILE */

@media(max-width:768px){

    .team-name{
        font-size:2rem;
    }

    .roster-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .button-group{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}

</style>
</head>

<body>

<div class="container">

<header>

<h1 class="team-name" id="teamName">
Loading...
</h1>

<p class="team-record" id="teamRecord"></p>

</header>

<div class="info-grid">

<div class="info-card">
<div class="info-label">Wins</div>
<div class="info-value" id="wins">-</div>
</div>

<div class="info-card">
<div class="info-label">Losses</div>
<div class="info-value" id="losses">-</div>
</div>

<div class="info-card">
<div class="info-label">Win %</div>
<div class="info-value" id="winPct">-</div>
</div>

</div>

<h2 class="section-title">Roster</h2>

<div class="roster-grid" id="rosterGrid"></div>

<div
    class="empty-state"
    id="emptyRoster"
    style="display:none;"
>
No roster data available
</div>

<div class="button-group">

<a href="standings.html" class="btn btn-primary">
← Back To Standings
</a>

<a href="roster.html" class="btn">
View Full Roster
</a>

<a href="index.html" class="btn">
← Back Home
</a>

</div>

</div>

<script>

const params =
    new URLSearchParams(window.location.search);

const teamName =
    decodeURIComponent(
        params.get("team") || ""
    ).trim();

/* =========================
   NORMALIZE
========================= */

function normalize(str){

    return str
        .toLowerCase()
        .replace(/[^\w\s]/g,"")
        .replace(/\s+/g,"")
        .trim();
}

/* =========================
   LOAD STANDINGS
========================= */

async function loadStandings(){

    const res =
        await fetch("standings.html");

    const html =
        await res.text();

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );

    const rows =
        doc.querySelectorAll("tbody tr");

    let found = null;

    rows.forEach(row => {

        const cells =
            row.querySelectorAll("td");

        if(cells.length < 5) return;

        const team =
            cells[1]?.innerText?.trim() || "";

        if(
            normalize(team) ===
            normalize(teamName)
        ){

            const wins =
                parseInt(
                    cells[2]?.innerText
                ) || 0;

            const losses =
                parseInt(
                    cells[3]?.innerText
                ) || 0;

            const pct =
                wins + losses === 0
                ? "0.000"
                : (
                    wins /
                    (wins + losses)
                  ).toFixed(3);

            found = {
                team,
                wins,
                losses,
                pct
            };
        }
    });

    return found;
}

/* =========================
   LOAD ROSTER
========================= */

async function loadRoster(){

    const res =
        await fetch("roster.html");

    const html =
        await res.text();

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );

    const teamCards =
        doc.querySelectorAll(".team");

    let players = [];

    teamCards.forEach(card => {

        const team =
            card
                .querySelector(".team-name")
                ?.innerText
                ?.trim() || "";

        if(
            normalize(team) ===
            normalize(teamName)
        ){

            const playerEls =
                card.querySelectorAll(
                    ".username"
                );

            playerEls.forEach(el => {

                const name =
                    el.innerText.trim();

                if(name){
                    players.push(name);
                }
            });
        }
    });

    return players;
}

/* =========================
   MAIN
========================= */

async function init(){

    const standings =
        await loadStandings();

    if(!standings){

        document.getElementById(
            "teamName"
        ).innerText =
            "Team Not Found";

        return;
    }

    document.getElementById(
        "teamName"
    ).innerText =
        standings.team;

    document.getElementById(
        "teamRecord"
    ).innerText =
        `${standings.wins}W - ${standings.losses}L`;

    document.getElementById(
        "wins"
    ).innerText =
        standings.wins;

    document.getElementById(
        "losses"
    ).innerText =
        standings.losses;

    document.getElementById(
        "winPct"
    ).innerText =
        standings.pct;

    const players =
        await loadRoster();

    const rosterGrid =
        document.getElementById(
            "rosterGrid"
        );

    const emptyRoster =
        document.getElementById(
            "emptyRoster"
        );

    if(players.length === 0){

        rosterGrid.style.display =
            "none";

        emptyRoster.style.display =
            "block";

        return;
    }

    rosterGrid.innerHTML =
        players.map(player => `

        <a
            class="player-card"
            href="profile.html?user=${encodeURIComponent(player)}"
        >

            <div class="player-name">
                ${player}
            </div>

            <div class="player-position">
                Player
            </div>

        </a>

        `).join("");
}

init();

</script>

</body>
</html>
