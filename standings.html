<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RRL - Standings</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <style> 
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0e27;
            --surface: #141829;
            --border: #2a2d4a;
            --accent: #7c3aed;
            --accent-light: #a78bfa;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f0f1f5;
            --text-dim: #9ca3af;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1a1538 100%);
            color: var(--text);
            padding: 2rem 1rem;
            min-height: 100vh;
            background-attachment: fixed;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 3rem;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-family: 'Rubik Mono One', monospace;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -2px;
            background: linear-gradient(135deg, var(--accent-light) 0%, #ec4899 50%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 0.9rem 1.2rem;
            color: var(--text);
            width: 100%;
            max-width: 350px;
            font-size: 0.95rem;
            font-family: 'Space Grotesk', sans-serif;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .search-box::placeholder {
            color: var(--text-dim);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
            transform: translateY(-2px);
        }

        .table-wrapper {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(90deg, rgba(124, 58, 237, 0.1) 0%, transparent 100%);
            border-bottom: 2px solid var(--border);
        }

        th {
            padding: 1.5rem 1.25rem;
            text-align: left;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-light);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            position: relative;
        }

        th:hover {
            background: rgba(124, 58, 237, 0.08);
            color: #fbbf24;
        }

        th::after {
            content: '⇅';
            margin-left: 0.5rem;
            opacity: 0;
            font-size: 0.7rem;
            transition: opacity 0.2s ease;
        }

        th:hover::after {
            opacity: 0.6;
        }

        th.sorted-asc::after {
            content: '↑';
            opacity: 1;
            color: #fbbf24;
        }

        th.sorted-desc::after {
            content: '↓';
            opacity: 1;
            color: #fbbf24;
        }

        tbody tr {
            border-bottom: 1px solid rgba(42, 45, 74, 0.7);
            transition: all 0.25s ease;
            position: relative;
        }

        tbody tr:hover {
            background: rgba(124, 58, 237, 0.06);
            box-shadow: inset 0 0 20px rgba(124, 58, 237, 0.05);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: 1.25rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .rank {
            font-family: 'Rubik Mono One', monospace;
            font-weight: 700;
            color: var(--accent);
            font-size: 1.3rem;
            width: 4rem;
            text-align: center;
        }

        .rank.top3 {
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
        }

        .team-name {
            font-weight: 700;
            color: var(--text);
            min-width: 180px;
            font-size: 1rem;
        }

        .stat {
            text-align: center;
            font-weight: 600;
            color: var(--text-dim);
        }

        .win-pct {
            font-weight: 700;
            font-size: 1.05rem;
            text-align: center;
        }

        .win-pct.elite {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
            padding: 0.35rem 0.7rem;
            border-radius: 6px;
        }

        .win-pct.strong {
            color: var(--success);
        }

        .win-pct.average {
            color: var(--text-dim);
        }

        .win-pct.weak {
            color: var(--warning);
        }

        .net {
            font-weight: 700;
            text-align: center;
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            min-width: 65px;
            font-size: 0.95rem;
        }

        .net.positive {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.2);
        }

        .net.negative {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.2);
        }

        .net.neutral {
            color: var(--text-dim);
        }

        .streak {
            font-family: 'Rubik Mono One', monospace;
            font-weight: 700;
            padding: 0.5rem 0.9rem;
            border-radius: 6px;
            text-align: center;
            min-width: 70px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .streak.win {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.25);
        }

        .streak.loss {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.25);
        }

        .last-three {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }

        .game {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            font-family: 'Rubik Mono One', monospace;
            transition: all 0.2s ease;
            cursor: default;
        }

        .game:hover {
            transform: scale(1.2) translateY(-3px);
        }

        .game.win {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        }

        .game.loss {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-dim);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            th, td {
                padding: 0.75rem 0.6rem;
                font-size: 0.8rem;
            }

            .team-name {
                min-width: 130px;
                font-size: 0.9rem;
            }

            .search-box {
                max-width: 100%;
            }

            .rank {
                font-size: 1rem;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .commish-btn {
            background: linear-gradient(135deg, var(--accent), #ec4899);
            border: none;
            color: var(--text);
            padding: 0.9rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .commish-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            color: var(--accent-light);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            color: var(--text-dim);
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .close-btn:hover {
            color: var(--accent);
        }

        .login-section p {
            margin-bottom: 1rem;
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .modal-input {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 6px;
            padding: 0.85rem 1rem;
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            width: 100%;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }

        .modal-btn {
            background: linear-gradient(135deg, var(--accent), #ec4899);
            border: none;
            color: var(--text);
            padding: 0.85rem 1.5rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .logout-btn {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            margin-top: 1.5rem;
        }

        .logout-btn:hover {
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .edit-controls {
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 0.75rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: var(--accent-light);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>RRL Standings</h1>
            <p class="subtitle">Week 4 Standings</p>
        </header>

        <div class="controls">
            <input type="text" id="searchBox" class="search-box" placeholder="🔍 Search team...">
            <button id="commishBtn" class="commish-btn">⚙️ Commissioner</button>
        </div>

        <!-- Commissioner Modal -->
        <div id="commishModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Commissioner Panel</h2>
                    <button id="closeModal" class="close-btn">&times;</button>
                </div>
                
                <div class="login-section" id="loginSection">
                    <p>Enter password to access commissioner tools:</p>
                    <input type="password" id="commishPassword" placeholder="Password" class="modal-input">
                    <button id="loginBtn" class="modal-btn">Login</button>
                </div>

                <div class="edit-section" id="editSection" style="display: none;">
                    <div class="edit-controls">
                        <select id="teamSelect" class="modal-input">
                            <option value="">Select a team...</option>
                        </select>
                        <div class="input-group">
                            <label>Wins</label>
                            <input type="number" id="winsInput" class="modal-input" min="0">
                        </div>
                        <div class="input-group">
                            <label>Losses</label>
                            <input type="number" id="lossesInput" class="modal-input" min="0">
                        </div>
                        <button id="updateBtn" class="modal-btn">Update Record</button>
                    </div>
                    <button id="logoutBtn" class="modal-btn logout-btn">Logout</button>
                </div>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="standingsTable">
                <thead>
                    <tr>
                        <th data-column="rank">#</th>
                        <th data-column="team">Team</th>
                        <th data-column="w">W</th>
                        <th data-column="l">L</th>
                        <th data-column="win_pct">Win %</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Populated by JavaScript -->
                </tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display: none;">
                <p>No teams found. Try adjusting your search.</p>
            </div>
        </div>
    </div>

    <script>
        const COMMISH_PASSWORD = "RRL2026";
        
        let standingsData = [
            { rank: 1, team: "Dinos 🦖", w: 3, l: 1 },
            { rank: 2, team: "Commies ⚒️", w: 3, l: 1 },
            { rank: 3, team: "Lions 🦁", w: 3, l: 1 },
            { rank: 4, team: "Villains 🦹", w: 3, l: 1 },
            { rank: 5, team: "Reapers 💀", w: 3, l: 1 },
            { rank: 6, team: "Knights🛡️", w: 3, l: 1 },
            { rank: 7, team: "Penguins 🐧", w: 2, l: 2 },
            { rank: 8, team: "Snakes 🐍", w: 2, l: 2 },
            { rank: 9, team: "Goats 🐐", w: 2, l: 2 },
            { rank: 10, team: "Bay Stars✨", w: 2, l: 2 },
            { rank: 11, team: "Kraken 🐙", w: 2, l: 2 },
            { rank: 12, team: "Gators 🐊", w: 2, l: 2 },
            { rank: 13, team: "Rangers 🤺", w: 1, l: 3 },
            { rank: 14, team: "Polarvears 🐻‍❄️", w: 1, l: 3 },
            { rank: 15, team: "Sharks 🦈", w: 0, l: 4 },
            { rank: 16, team: "Titans ⚔️", w: 0, l: 4 },
        ];

        let isLoggedIn = false;

        function calculateWinPct(w, l) {
            const gp = w + l;
            if (gp === 0) return 0;
            return w / gp;
        }

        function getWinPctClass(pct) {
            if (pct >= 0.75) return 'elite';
            if (pct >= 0.50) return 'strong';
            if (pct >= 0.25) return 'average';
            return 'weak';
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');

            // Sort by wins then by losses
            const sorted = [...data].sort((a, b) => {
                if (b.w !== a.w) return b.w - a.w;
                return a.l - b.l;
            });

            // Update ranks
            sorted.forEach((team, idx) => {
                team.rank = idx + 1;
            });

            if (sorted.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            tbody.innerHTML = sorted.map(row => {
                const win_pct = calculateWinPct(row.w, row.l);
                const winPctClass = getWinPctClass(win_pct);
                const rankClass = row.rank <= 3 ? 'top3' : '';

                return `
                    <tr>
                        <td class="rank ${rankClass}">${row.rank}</td>
                        <td class="team-name">${row.team}</td>
                        <td class="stat">${row.w}</td>
                        <td class="stat">${row.l}</td>
                        <td class="stat win-pct ${winPctClass}">${(win_pct * 100).toFixed(1)}%</td>
                    </tr>
                `;
            }).join('');
        }

        function filterAndSort(data, searchTerm, sortColumn, sortDirection) {
            let filtered = data.filter(row =>
                row.team.toLowerCase().includes(searchTerm.toLowerCase())
            );

            if (sortColumn && sortColumn !== 'rank') {
                filtered.sort((a, b) => {
                    let aVal = a[sortColumn];
                    let bVal = b[sortColumn];

                    if (typeof aVal === 'string') {
                        aVal = aVal.toLowerCase();
                        bVal = bVal.toLowerCase();
                    }

                    const comparison = aVal > bVal ? 1 : aVal < bVal ? -1 : 0;
                    return sortDirection === 'asc' ? comparison : -comparison;
                });
            }

            return filtered;
        }

        let currentSort = { column: 'rank', direction: 'asc' };

        // Commissioner Modal Logic
        const modal = document.getElementById('commishModal');
        const commishBtn = document.getElementById('commishBtn');
        const closeModal = document.getElementById('closeModal');
        const loginSection = document.getElementById('loginSection');
        const editSection = document.getElementById('editSection');
        const commishPassword = document.getElementById('commishPassword');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const teamSelect = document.getElementById('teamSelect');
        const winsInput = document.getElementById('winsInput');
        const lossesInput = document.getElementById('lossesInput');
        const updateBtn = document.getElementById('updateBtn');

        commishBtn.addEventListener('click', () => {
            isLoggedIn = false;
            loginSection.style.display = 'block';
            editSection.style.display = 'none';
            commishPassword.value = '';
            modal.style.display = 'flex';
        });

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        loginBtn.addEventListener('click', () => {
            if (commishPassword.value === COMMISH_PASSWORD) {
                isLoggedIn = true;
                loginSection.style.display = 'none';
                editSection.style.display = 'block';
                populateTeamSelect();
            } else {
                alert('Incorrect password');
                commishPassword.value = '';
            }
        });

        logoutBtn.addEventListener('click', () => {
            isLoggedIn = false;
            loginSection.style.display = 'block';
            editSection.style.display = 'none';
            commishPassword.value = '';
        });

        function populateTeamSelect() {
            teamSelect.innerHTML = '<option value="">Select a team...</option>';
            standingsData.forEach((team, idx) => {
                const option = document.createElement('option');
                option.value = idx;
                option.textContent = team.team;
                teamSelect.appendChild(option);
            });
        }

        teamSelect.addEventListener('change', () => {
            if (teamSelect.value === '') {
                winsInput.value = '';
                lossesInput.value = '';
            } else {
                const team = standingsData[teamSelect.value];
                winsInput.value = team.w;
                lossesInput.value = team.l;
            }
        });

        updateBtn.addEventListener('click', () => {
            if (teamSelect.value === '') {
                alert('Please select a team');
                return;
            }

            const teamIdx = parseInt(teamSelect.value);
            const w = parseInt(winsInput.value);
            const l = parseInt(lossesInput.value);

            if (isNaN(w) || isNaN(l) || w < 0 || l < 0) {
                alert('Please enter valid wins and losses');
                return;
            }

            standingsData[teamIdx].w = w;
            standingsData[teamIdx].l = l;

            renderTable(standingsData);
            alert(`${standingsData[teamIdx].team} updated: ${w}W - ${l}L`);
        });

        // Search functionality
        document.getElementById('searchBox').addEventListener('input', (e) => {
            const filtered = filterAndSort(standingsData, e.target.value, currentSort.column, currentSort.direction);
            renderTable(filtered);
        });

        // Sortable headers
        document.querySelectorAll('th').forEach(header => {
            header.addEventListener('click', () => {
                const column = header.dataset.column;

                document.querySelectorAll('th').forEach(th => {
                    th.classList.remove('sorted-asc', 'sorted-desc');
                });

                if (currentSort.column === column) {
                    currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSort.column = column;
                    currentSort.direction = 'asc';
                }

                header.classList.add(`sorted-${currentSort.direction}`);

                const searchTerm = document.getElementById('searchBox').value;
                const filtered = filterAndSort(standingsData, searchTerm, column, currentSort.direction);
                renderTable(filtered);
            });
        });

        // Initial render
        renderTable(standingsData);
    </script>
</body>
</html>
