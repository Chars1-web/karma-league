<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRL Leaderboard</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg:#07080c;
  --card:#11131b;
  --border:#1d2230;
  --accent:#e8ff3c;
  --text:#f5f5f5;
  --muted:#8a8fa3;
  --hover:#141827;
  --highlight:#1a1f2e;
}

* { box-sizing:border-box; }

body {
  margin:0;
  padding:40px 16px;
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
}

html, body {
  height: 100%;
  overflow-anchor: none;
}

.container {
  max-width:1000px;
  margin:0 auto;
}

h1 {
  font-family:'Bebas Neue',sans-serif;
  font-size:54px;
  text-align:center;
  letter-spacing:3px;
  margin-bottom:10px;
}

/* TABLE */
.table-wrapper {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  overflow-x:auto;
  overflow-y:hidden;
}

table {
  width:100%;
  min-width:850px;
  border-collapse:collapse;
  table-layout:fixed;
}

thead {
  background:rgba(29,34,48,0.7);
}

th {
  padding:14px 12px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--accent);
  text-align:left;
  white-space:nowrap;
  cursor:pointer;
}

td {
  padding:14px 12px;
  font-size:14px;
  border-bottom:1px solid rgba(29,34,48,0.6);
}

tbody tr:hover {
  background:var(--hover);
}

.rank-col {
  width:60px;
  color:var(--accent);
  font-weight:700;
  text-align:center;
}

.player-col a {
  color:var(--accent);
  text-decoration:none;
}

.player-col a:hover {
  color:#c9dd1a;
}

.team-col {
  color:var(--muted);
}

.stat-col {
  text-align:right;
}

.highlight {
  background:var(--highlight);
  border-left:4px solid var(--accent);
}

.back {
  text-align:center;
  margin-top:25px;
}

a {
  color:var(--accent);
  text-decoration:none;
}

</style>
</head>

<body>

<div class="container">
  <h1>RRL Leaderboard</h1>

  <div id="wrap">Loading...</div>

  <div class="back">
    <a href="index.html">← Back Home</a>
  </div>
</div>

<script>

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vS7OR3Jlik3PnCF6unj_M78_LjWaEkd6gfO85-BPeEP3uW-9JO0oWfRVxeTloj-oU6Aq38YGlCEbiAD/pub?gid=1287343484&single=true&output=csv";

const params = new URLSearchParams(window.location.search);
const selectedUser = (params.get("user") || "").trim();

let players = [];
let sortColumn = "points";
let sortDir = "desc";

function parseCSV(text){
  return text.trim().split("\n").map(r => r.split(","));
}

/* =========================
   SORT FUNCTION (FIXED)
========================= */
function sortData(col){

  if(sortColumn === col){
    sortDir = sortDir === "asc" ? "desc" : "asc";
  } else {
    sortColumn = col;
    sortDir = "desc";
  }

  const dir = sortDir === "asc" ? 1 : -1;

  players.sort((a,b)=>{

    let x = a[col];
    let y = b[col];

    if(typeof x === "string") x = x.toLowerCase();
    if(typeof y === "string") y = y.toLowerCase();

    if(x > y) return dir;
    if(x < y) return -dir;
    return 0;
  });

  render();
}

/* =========================
   RENDER
========================= */
function render(){

  let html = `
  <div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th onclick="sortData('rank')">Rank</th>
        <th onclick="sortData('name')">Player</th>
        <th onclick="sortData('team')">Team</th>
        <th onclick="sortData('games')">GP</th>
        <th onclick="sortData('rating')">Rating AVG</th>
        <th onclick="sortData('points')">Points For</th>
      </tr>
    </thead>
    <tbody>
  `;

  players.forEach((p,i)=>{

    html += `
      <tr class="${p.name===selectedUser?'highlight':''}">
        <td class="rank-col">${i+1}</td>
        <td class="player-col">
          <a href="profile.html?user=${encodeURIComponent(p.name)}">${p.name}</a>
        </td>
        <td class="team-col">${p.team}</td>
        <td class="stat-col">${p.games}</td>
        <td class="stat-col">${p.rating}</td>
        <td class="stat-col">${p.points}</td>
      </tr>
    `;
  });

  html += `</tbody></table></div>`;

  document.getElementById("wrap").innerHTML = html;
}

/* =========================
   LOAD (DEFAULT = POINTS FOR)
========================= */
async function load(){

  const res = await fetch(SHEET_URL);
  const text = await res.text();

  const rows = parseCSV(text).slice(1);

  players = rows.map(r=>({
    rank:0,
    name:(r[1]||"").trim(),
    team:r[2]||"—",
    games:Number(r[3])||0,
    rating:Number(r[4])||0,
    points:Number(r[5])||0
  })).filter(p=>p.name);

  // 🔥 DEFAULT SORT: POINTS FOR (DESC)
  sortColumn = "points";
  sortDir = "desc";

  players.sort((a,b)=>b.points - a.points);

  render();
}

load();

</script>

</body>
</html>
