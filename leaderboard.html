<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRL Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #07080c;
  --card: #11131b;
  --border: #1d2230;
  --accent: #e8ff3c;
  --accent-dark: #c9dd1a;
  --text: #f5f5f5;
  --muted: #8a8fa3;
  --hover: #141827;
  --highlight: #1a1f2e;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 40px 16px;
  background: linear-gradient(135deg, var(--bg) 0%, #0a0d13 100%);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
}

h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 56px;
  text-align: center;
  letter-spacing: 3px;
  margin: 0 0 8px 0;
  color: var(--text);
  text-shadow: 0 2px 20px rgba(232, 255, 60, 0.1);
}

.sub {
  text-align: center;
  color: var(--muted);
  margin-bottom: 40px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 1px;
}

/* =======================
   FIX IS HERE 👇
======================= */

.table-wrapper {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow-x: auto;        /* ✅ enables horizontal scroll */
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
              inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

table {
  width: 100%;
  min-width: 900px;        /* ✅ forces scroll instead of squish */
  border-collapse: collapse;
}

/* ======================= */

thead {
  background: linear-gradient(90deg, rgba(29, 34, 48, 0.8), rgba(29, 34, 48, 0.4));
  border-bottom: 2px solid var(--border);
}

th {
  padding: 16px 14px;
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  text-align: left;
  cursor: pointer;
  user-select: none;
  transition: all 0.2s ease;
  position: relative;
  white-space: nowrap;
}

th:hover {
  background: rgba(232, 255, 60, 0.08);
}

.sort-icon {
  display: inline-block;
  margin-left: 6px;
  font-size: 10px;
  opacity: 0.4;
}

tbody tr {
  border-bottom: 1px solid rgba(29, 34, 48, 0.8);
  transition: all 0.15s ease;
}

tbody tr:hover {
  background: var(--hover);
}

td {
  padding: 14px;
  font-size: 14px;
  color: var(--text);
}

.rank-col {
  font-weight: 700;
  color: var(--accent);
  width: 50px;
  text-align: center;
}

.player-col a {
  color: var(--accent);
  text-decoration: none;
}

.player-col a:hover {
  color: var(--accent-dark);
}

.team-col {
  color: var(--muted);
}

.stat-col {
  text-align: right;
}

.highlight {
  background: var(--highlight) !important;
  border-left: 4px solid var(--accent);
}

.back {
  text-align: center;
  margin-top: 32px;
}

a {
  color: var(--accent);
  text-decoration: none;
}

</style>
</head>

<body>

<div class="container">
  <h1>RRL Leaderboard</h1>
  <div class="sub">Click column headers to sort</div>

  <div id="wrap" class="loading">Loading leaderboard...</div>

  <div class="back">
    <a href="index.html">← Back Home</a>
  </div>
</div>

<script>

const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7OR3Jlik3PnCF6unj_M78_LjWaEkd6gfO85-BPeEP3uW-9JO0oWfRVxeTloj-oU6Aq38YGlCEbiAD/pub?gid=1287343484&single=true&output=csv";

const params = new URLSearchParams(window.location.search);
const selectedUser = (params.get("user") || "").trim();

function parseCSV(text) {
  return text.trim().split("\n").map(r => r.split(","));
}

async function load() {

  const res = await fetch(SHEET_URL);
  const text = await res.text();

  const rows = parseCSV(text).slice(1);

  let players = [];

  for (const r of rows) {

    const name = (r[1] || "").trim();
    if (!name) continue;

    players.push({
      name,
      team: r[2] || "—",
      games: Number(r[3]) || 0,
      rating: Number(r[4]) || 0,
      points: Number(r[5]) || 0
    });

  }

  players.sort((a, b) => b.points - a.points);

  let html = `
  <div class="table-wrapper">
  <table>
    <tr>
      <th>Rank</th>
      <th>Player</th>
      <th>Team</th>
      <th>Games</th>
      <th>Rating</th>
      <th>Points Forced</th>
    </tr>
  `;

  players.forEach((p, i) => {

    const isSelected = p.name === selectedUser;

    html += `
      <tr class="${isSelected ? "highlight" : ""}">
        <td class="rank-col">${i + 1}</td>
        <td class="player-col">
          <a href="profile.html?user=${encodeURIComponent(p.name)}">
            ${p.name}
          </a>
        </td>
        <td class="team-col">${p.team}</td>
        <td class="stat-col">${p.games}</td>
        <td class="stat-col">${p.rating}</td>
        <td class="stat-col">${p.points}</td>
      </tr>
    `;
  });

  html += `</table></div>`;

  document.getElementById("wrap").innerHTML = html;
}

load();

</script>

</body>
</html>
