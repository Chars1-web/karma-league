<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RRL Player Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --border: #252525;
            --accent: #00d9ff;
            --accent-dark: #0099cc;
            --warning: #ff6b35;
            --success: #00ff41;
            --text: #ffffff;
            --text-dim: #808080;
            --grid: rgba(0, 217, 255, 0.05);
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
            background: linear-gradient(180deg, #0d0d0d 0%, #1a0d1a 50%, #0d0d0d 100%);
            color: var(--text);
            padding: 2rem 1rem;
            min-height: 100vh;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(0, 217, 255, 0.03) 25%, rgba(0, 217, 255, 0.03) 26%, transparent 27%, transparent 74%, rgba(0, 217, 255, 0.03) 75%, rgba(0, 217, 255, 0.03) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 217, 255, 0.03) 25%, rgba(0, 217, 255, 0.03) 26%, transparent 27%, transparent 74%, rgba(0, 217, 255, 0.03) 75%, rgba(0, 217, 255, 0.03) 76%, transparent 77%, transparent);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: glitchIn 0.8s ease-out;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 2rem;
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--warning), transparent);
            animation: shimmer 2s infinite;
        }

        .player-name {
            font-family: 'Space Mono', monospace;
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.5), 0 0 40px rgba(0, 217, 255, 0.3);
            line-height: 1;
        }

        .player-name.error {
            color: var(--warning);
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.5);
        }

        .player-team {
            color: var(--warning);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 107, 53, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--surface) 0%, rgba(0, 217, 255, 0.05) 100%);
            border: 2px solid var(--accent);
            border-radius: 0px;
            padding: 2rem 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2), inset 0 0 20px rgba(0, 217, 255, 0.05);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            animation: borderGlow 2s infinite;
        }

        .stat-card:hover {
            border-color: var(--warning);
            transform: translateY(-8px);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.4), inset 0 0 20px rgba(0, 217, 255, 0.08);
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .stat-value {
            font-family: 'Space Mono', monospace;
            font-size: 3rem;
            font-weight: 700;
            color: var(--success);
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.6);
            letter-spacing: 2px;
        }

        .matchdays-section {
            margin-bottom: 3rem;
        }

        .section-title {
            font-family: 'Space Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 217, 255, 0.4);
            position: relative;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--accent);
        }

        .section-title::before {
            content: '[ ';
            color: var(--warning);
            margin-right: 0.5rem;
        }

        .section-title::after {
            content: ' ]';
            color: var(--warning);
            margin-left: 0.5rem;
        }

        .matchdays-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            animation: slideUp 0.8s ease-out 0.4s both;
        }

        .matchday-btn {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 0px;
            padding: 1rem;
            color: var(--text-dim);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Space Mono', monospace;
            position: relative;
            overflow: hidden;
        }

        .matchday-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 217, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .matchday-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.3), inset 0 0 15px rgba(0, 217, 255, 0.05);
        }

        .matchday-btn.active {
            background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent) 100%);
            border-color: var(--accent);
            color: var(--bg);
            font-weight: 700;
            box-shadow: 0 0 25px rgba(0, 217, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.1);
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.8);
        }

        .matchday-score {
            background: linear-gradient(135deg, var(--surface) 0%, rgba(0, 217, 255, 0.05) 100%);
            border: 2px solid var(--accent);
            border-radius: 0px;
            padding: 3rem 2rem;
            text-align: center;
            animation: fadeInScale 0.4s ease-out;
            display: none;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.3), inset 0 0 30px rgba(0, 217, 255, 0.05);
        }

        .matchday-score::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(0, 217, 255, 0.1) 50%, transparent 70%);
            animation: shimmerDiag 3s infinite;
            pointer-events: none;
        }

        .matchday-score.active {
            display: block;
        }

        .matchday-title {
            color: var(--warning);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 107, 53, 0.4);
        }

        .score-display {
            font-family: 'Space Mono', monospace;
            font-size: 5rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 30px rgba(0, 217, 255, 0.8), 0 0 60px rgba(0, 217, 255, 0.4);
            margin: 1.5rem 0;
            letter-spacing: 3px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .score-details {
            display: flex;
            justify-content: space-around;
            margin-top: 2rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .score-detail {
            flex: 1;
            min-width: 140px;
            padding: 1rem;
            border: 1px solid var(--accent);
            border-radius: 0px;
            background: rgba(0, 217, 255, 0.05);
        }

        .detail-label {
            color: var(--text-dim);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .detail-value {
            font-weight: 700;
            color: var(--success);
            font-size: 1.5rem;
            font-family: 'Space Mono', monospace;
            text-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 3rem;
            flex-wrap: wrap;
            animation: slideUp 0.8s ease-out 0.6s both;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            padding: 1rem 1.5rem;
            border: 2px solid var(--accent);
            border-radius: 0px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Space Mono', monospace;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent);
            z-index: -1;
            transition: left 0.3s ease;
        }

        .btn-primary {
            background: transparent;
            color: var(--accent);
            box-shadow: inset 0 0 20px rgba(0, 217, 255, 0.1);
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }

        .btn-primary:hover {
            color: var(--bg);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.6), inset 0 0 20px rgba(0, 217, 255, 0.2);
        }

        .btn-primary:hover::before {
            left: 0;
        }

        .btn-secondary {
            background: transparent;
            color: var(--warning);
            border-color: var(--warning);
            text-decoration: none;
            display: inline-block;
            text-align: center;
            box-shadow: inset 0 0 20px rgba(255, 107, 53, 0.1);
            text-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
        }

        .btn-secondary:hover {
            color: var(--bg);
            box-shadow: 0 0 30px rgba(255, 107, 53, 0.6), inset 0 0 20px rgba(255, 107, 53, 0.2);
        }

        .btn-secondary::before {
            background: var(--warning);
        }

        .btn-secondary:hover::before {
            left: 0;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-dim);
            border: 2px dashed var(--border);
            font-family: 'Space Mono', monospace;
        }

        @media (max-width: 768px) {
            .player-name {
                font-size: 2rem;
                letter-spacing: 2px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .score-display {
                font-size: 3.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @keyframes glitchIn {
            0% {
                opacity: 0;
                clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
            }
            50% {
                clip-path: polygon(0 25%, 100% 25%, 100% 75%, 0 75%);
            }
            100% {
                opacity: 1;
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes shimmer {
            0%, 100% {
                transform: translateX(-100%);
            }
            50% {
                transform: translateX(100%);
            }
        }

        @keyframes borderGlow {
            0% {
                left: -100%;
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                left: 100%;
                opacity: 0;
            }
        }

        @keyframes shimmerDiag {
            0% {
                transform: translate(-100%, -100%);
            }
            100% {
                transform: translate(100%, 100%);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.85;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="player-name" id="playerName">Loading...</h1>
            <p class="player-team" id="playerTeam"></p>
        </header>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Games Played</div>
                <div class="stat-value" id="gamesPlayed">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Rating</div>
                <div class="stat-value" id="avgRating">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Points Forced</div>
                <div class="stat-value" id="pointsForced">-</div>
            </div>
        </div>

        <div class="matchdays-section">
            <h2 class="section-title">Matchday Scores</h2>
            
            <div class="matchdays-container" id="matchdaysContainer">
                <!-- Populated by JS -->
            </div>

            <div id="scoresContainer">
                <!-- Score details populated by JS -->
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                > NO MATCHDAY DATA AVAILABLE
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" onclick="goLeaderboard()">View Leaderboard</button>
            <a href="index.html" class="btn btn-secondary">← Back Home</a>
        </div>
    </div>

    <script>
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7OR3Jlik3PnCF6unj_M78_LjWaEkd6gfO85-BPeEP3uW-9JO0oWfRVxeTloj-oU6Aq38YGlCEbiAD/pub?gid=1287343484&single=true&output=csv";
        const MATCHDAY_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7OR3Jlik3PnCF6unj_M78_LjWaEkd6gfO85-BPeEP3uW-9JO0oWfRVxeTloj-oU6Aq38YGlCEbiAD/pub?gid=0&single=true&output=csv";

        const params = new URLSearchParams(window.location.search);
        const user = (params.get("user") || "").trim();

        function parseCSV(text) {
            return text.trim().split("\n").map(r => r.split(","));
        }

        let playerData = null;
        let matchdayData = [];

        async function loadProfile() {
            if (!user) {
                document.getElementById("playerName").innerText = "Unknown Player";
                document.getElementById("playerName").classList.add("error");
                return;
            }

            try {
                const res = await fetch(SHEET_URL);
                const text = await res.text();
                const rows = parseCSV(text).slice(1);

                let found = null;
                for (const r of rows) {
                    const username = (r[1] || "").trim();
                    if (username === user) {
                        found = r;
                        break;
                    }
                }

                if (!found) {
                    document.getElementById("playerName").innerText = user + " (Not Found)";
                    document.getElementById("playerName").classList.add("error");
                    document.getElementById("statsGrid").innerHTML = "<p class='empty-state'>> PLAYER NOT FOUND IN DATABASE</p>";
                    return;
                }

                playerData = {
                    name: user,
                    team: found[2],
                    games: found[3],
                    rating: found[4],
                    points: found[5]
                };

                document.getElementById("playerName").innerText = playerData.name;
                document.getElementById("playerTeam").innerHTML = `<a href="team-profile.html?team=${encodeURIComponent(playerData.team)}" style="color: inherit; text-decoration: none; cursor: pointer; transition: color 0.2s;" onmouseover="this.style.color='#ff6b35'" onmouseout="this.style.color='inherit'">${playerData.team}</a>`;
                document.getElementById("gamesPlayed").innerText = playerData.games || "-";
                document.getElementById("avgRating").innerText = playerData.rating || "-";
                document.getElementById("pointsForced").innerText = playerData.points || "-";

                await loadMatchdayScores();
            } catch (error) {
                console.error("Error loading profile:", error);
                document.getElementById("playerName").innerText = "System Error";
                document.getElementById("playerName").classList.add("error");
            }
        }

        async function loadMatchdayScores() {
            try {
                const res = await fetch(MATCHDAY_SHEET_URL);
                const text = await res.text();
                const rows = parseCSV(text);

                if (rows.length < 2) {
                    document.getElementById("emptyState").style.display = "block";
                    return;
                }

                const headers = rows[0];
                const userColIndex = headers.findIndex(h => h.trim().toLowerCase() === user.toLowerCase());

                if (userColIndex === -1) {
                    document.getElementById("emptyState").style.display = "block";
                    return;
                }

                matchdayData = [];
                for (let i = 1; i < rows.length; i++) {
                    const matchdayName = rows[i][0];
                    const score = rows[i][userColIndex];
                    if (matchdayName && score) {
                        matchdayData.push({
                            matchday: matchdayName,
                            score: score
                        });
                    }
                }

                if (matchdayData.length === 0) {
                    document.getElementById("emptyState").style.display = "block";
                    return;
                }

                renderMatchdayButtons();
                selectMatchday(0);
            } catch (error) {
                console.error("Error loading matchday scores:", error);
                document.getElementById("emptyState").style.display = "block";
            }
        }

        function renderMatchdayButtons() {
            const container = document.getElementById("matchdaysContainer");
            container.innerHTML = matchdayData.map((md, idx) => 
                `<button class="matchday-btn ${idx === 0 ? 'active' : ''}" onclick="selectMatchday(${idx})">${md.matchday}</button>`
            ).join('');
        }

        function selectMatchday(index) {
            document.querySelectorAll('.matchday-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === index);
            });

            const scoresContainer = document.getElementById("scoresContainer");
            scoresContainer.innerHTML = '';

            const md = matchdayData[index];
            const scoreCard = document.createElement('div');
            scoreCard.className = 'matchday-score active';
            scoreCard.innerHTML = `
                <div class="matchday-title">>> ${md.matchday}</div>
                <div class="score-display">${md.score}</div>
                <div class="score-details">
                    <div class="score-detail">
                        <div class="detail-label">Points</div>
                        <div class="detail-value">${md.score}</div>
                    </div>
                </div>
            `;
            scoresContainer.appendChild(scoreCard);
        }

        function goLeaderboard() {
            window.location.href = "leaderboard.html?user=" + encodeURIComponent(user);
        }

        loadProfile();
    </script>
</body>
</html>
