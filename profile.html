<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RRL Player Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#07080c;
  --card:#11131b;
  --border:#1d2230;
  --accent:#e8ff3c;
  --text:#f5f5f5;
  --muted:#8a8fa3;
}

body{
  margin:0;
  padding:30px 16px;
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
}

h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:50px;
  text-align:center;
  letter-spacing:2px;
}

.card{
  max-width:650px;
  margin:20px auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
}

.stat{
  padding:12px;
  border-bottom:1px solid var(--border);
  font-size:14px;
}

.stat:last-child{
  border-bottom:none;
}

label{
  color:var(--muted);
  font-size:12px;
}

button{
  width:100%;
  margin-top:15px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  font-weight:700;
  cursor:pointer;
}

.back{
  text-align:center;
  margin-top:15px;
}

a{
  color:var(--accent);
  text-decoration:none;
}
</style>
</head>

<body>

<h1 id="name">Loading...</h1>

<div class="card" id="stats">
  Loading stats...
</div>

<button onclick="goLeaderboard()">View Leaderboard</button>

<div class="back">
  <a href="index.html">← Back Home</a>
</div>

<script>

const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7OR3Jlik3PnCF6unj_M78_LjWaEkd6gfO85-BPeEP3uW-9JO0oWfRVxeTloj-oU6Aq38YGlCEbiAD/pub?gid=1287343484&single=true&output=csv";

const params = new URLSearchParams(window.location.search);
const user = (params.get("user") || "").trim();

function parseCSV(text){
  return text.trim().split("\n").map(r => r.split(","));
}

async function loadProfile(){

  if(!user){
    document.getElementById("name").innerText = "Unknown Player";
    return;
  }

  const res = await fetch(SHEET_URL);
  const text = await res.text();
  const rows = parseCSV(text).slice(1);

  let found = null;

  for(const r of rows){

    const username = (r[1] || "").trim(); // COLUMN B

    if(username === user){
      found = r;
      break;
    }
  }

  if(!found){
    document.getElementById("name").innerText = user + " (Not Found)";
    document.getElementById("stats").innerHTML = "No stats available.";
    return;
  }

  const team = found[2];      // C
  const games = found[3];     // D
  const rating = found[4];    // E
  const points = found[5];    // F

  document.getElementById("name").innerText = user;

  document.getElementById("stats").innerHTML = `
    <div class="stat"><label>Team</label><div>${team}</div></div>
    <div class="stat"><label>Games Played</label><div>${games}</div></div>
    <div class="stat"><label>Avg Rating</label><div>${rating}</div></div>
    <div class="stat"><label>Points Forced</label><div>${points}</div></div>
  `;
}

function goLeaderboard(){
  window.location.href = "leaderboard.html?user=" + encodeURIComponent(user);
}

loadProfile();

</script>

</body>
</html>
