<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #f8f9fb;
  --bg-secondary: #ffffff;
  --accent-primary: #3b82f6;
  --accent-secondary: #ec4899;
  --text-primary: #1f2937;
  --text-secondary: #6b7280;
  --border-color: #e5e7eb;
  --success: #10b981;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px;
  line-height: 1.6;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 20px;
}

/* Header Section */
.header {
  text-align: center;
  margin-bottom: 50px;
  animation: slideDown 0.6s ease;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.player-name {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.5rem, 8vw, 4rem);
  font-weight: 800;
  letter-spacing: -1px;
  color: var(--text-primary);
  margin-bottom: 15px;
  text-transform: uppercase;
}

.player-status {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--text-secondary);
  text-transform: uppercase;
}

.player-status.found::before {
  content: '● ';
  color: var(--success);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* Stats Grid */
.stats-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
  animation: slideUp 0.6s 0.15s both ease;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.stat-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 24px 20px;
  transition: all 0.3s ease;
}

.stat-card:hover {
  border-color: var(--accent-primary);
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
}

.stat-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
  display: block;
}

.stat-value {
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  font-weight: 700;
  line-height: 1;
  color: var(--accent-primary);
  font-family: 'Playfair Display', serif;
}

/* Action Buttons */
.button-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 30px;
  animation: slideUp 0.6s 0.3s both ease;
}

button {
  width: 100%;
  padding: 14px 24px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  border: 2px solid transparent;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  text-transform: uppercase;
  font-family: 'Space Grotesk', sans-serif;
  position: relative;
  overflow: hidden;
}

button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.1);
  transition: left 0.3s ease;
  z-index: 0;
}

button:hover::before {
  left: 100%;
}

.btn-primary {
  background: var(--accent-primary);
  color: white;
  border-color: var(--accent-primary);
}

.btn-primary:hover {
  opacity: 0.9;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

.btn-secondary {
  background: transparent;
  color: var(--accent-primary);
  border-color: var(--accent-primary);
}

.btn-secondary:hover {
  background: rgba(59, 130, 246, 0.08);
}

button span {
  position: relative;
  z-index: 1;
}

/* Footer Navigation */
.footer-nav {
  text-align: center;
  padding-top: 30px;
  border-top: 1px solid var(--border-color);
  animation: slideUp 0.6s 0.45s both ease;
}

.footer-nav a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--accent-primary);
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.3s ease;
}

.footer-nav a:hover {
  gap: 12px;
  color: var(--accent-secondary);
}

/* Loading state */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 200px;
  font-size: 18px;
  color: var(--text-secondary);
}

.loading::after {
  content: '';
  display: inline-block;
  width: 20px;
  height: 20px;
  margin-left: 12px;
  border: 2px solid var(--border-color);
  border-top-color: var(--accent-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Not Found State */
.not-found {
  text-align: center;
  padding: 60px 20px;
}

.not-found h2 {
  font-size: 24px;
  margin-bottom: 12px;
  color: var(--accent-primary);
}

.not-found p {
  color: var(--text-secondary);
  margin-bottom: 30px;
}

/* Responsive */
@media (max-width: 768px) {
  .stats-container {
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  .player-name {
    font-size: 2rem;
  }
}

@media (max-width: 480px) {
  .stats-container {
    grid-template-columns: 1fr;
  }

  .container {
    padding: 20px 16px;
  }

  .player-name {
    font-size: 1.5rem;
  }
}
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1 class="player-name" id="name">Loading...</h1>
    <span class="player-status" id="status"></span>
  </div>

  <!-- Stats Grid -->
  <div class="stats-container" id="stats">
    <div class="loading">Loading player data</div>
  </div>

  <!-- Action Buttons -->
  <div class="button-group">
    <button class="btn-primary" onclick="goLeaderboard()">
      <span>→ View Leaderboard</span>
    </button>
    <button class="btn-secondary" onclick="goHome()">
      <span>← Back Home</span>
    </button>
  </div>

  <!-- Footer -->
  <div class="footer-nav">
    <a href="index.html">Return to Dashboard</a>
  </div>
</div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7OR3Jlik3PnCF6unj_M78_LjWaEkd6gfO85-BPeEP3uW-9JO0oWfRVxeTloj-oU6Aq38YGlCEbiAD/pub?gid=1287343484&single=true&output=csv";

const params = new URLSearchParams(window.location.search);
const user = (params.get("user") || "").trim();

function parseCSV(text) {
  return text.trim().split("\n").map(r => r.split(","));
}

async function loadProfile() {
  if (!user) {
    renderNotFound("Unknown Player");
    return;
  }

  try {
    const res = await fetch(SHEET_URL);
    const text = await res.text();
    const rows = parseCSV(text).slice(1);

    let found = null;

    for (const r of rows) {
      const username = (r[1] || "").trim();
      if (username === user) {
        found = r;
        break;
      }
    }

    if (!found) {
      renderNotFound(user);
      return;
    }

    renderProfile(found);
  } catch (error) {
    console.error("Error loading profile:", error);
    renderError();
  }
}

function renderProfile(playerData) {
  const team = playerData[2];
  const games = playerData[3];
  const rating = playerData[4];
  const points = playerData[5];

  document.getElementById("name").innerText = user;
  document.getElementById("status").innerText = "Active Player";
  document.getElementById("status").classList.add("found");

  document.getElementById("stats").innerHTML = `
    <div class="stat-card">
      <span class="stat-label">Team</span>
      <div class="stat-value">${escapeHtml(team)}</div>
    </div>
    <div class="stat-card">
      <span class="stat-label">Games Played</span>
      <div class="stat-value">${escapeHtml(games)}</div>
    </div>
    <div class="stat-card">
      <span class="stat-label">Avg Rating</span>
      <div class="stat-value">${escapeHtml(rating)}</div>
    </div>
    <div class="stat-card">
      <span class="stat-label">Points Forced</span>
      <div class="stat-value">${escapeHtml(points)}</div>
    </div>
  `;
}

function renderNotFound(playerName) {
  document.getElementById("name").innerText = playerName;
  document.getElementById("status").innerText = "Player Not Found";
  document.getElementById("status").style.color = "#ff006e";

  document.getElementById("stats").innerHTML = `
    <div class="not-found" style="grid-column: 1 / -1;">
      <h2>Player Not Found</h2>
      <p>No statistics available for this player. Please check the username and try again.</p>
    </div>
  `;
}

function renderError() {
  document.getElementById("name").innerText = "Error";
  document.getElementById("status").innerText = "Connection Failed";

  document.getElementById("stats").innerHTML = `
    <div class="not-found" style="grid-column: 1 / -1;">
      <h2>Unable to Load Profile</h2>
      <p>There was an error fetching player data. Please try again later.</p>
    </div>
  `;
}

function goLeaderboard() {
  window.location.href = "leaderboard.html?user=" + encodeURIComponent(user);
}

function goHome() {
  window.location.href = "index.html";
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.innerText = text;
  return div.innerHTML;
}

// Load profile on page ready
loadProfile();
</script>

</body>
</html>
