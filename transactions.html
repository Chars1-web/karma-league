<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RRL – Transactions</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #050508;
  --card: #13131c;
  --border: #1e1e2e;
  --accent: #00e5ff;
  --accent2: #ff3c6e;
  --text: #f0f0f0;
  --muted: #6b6b80;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

header {
  position: relative;
  z-index: 1;
  padding: 40px 24px 20px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

.eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 10px;
}

h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(36px,8vw,72px);
  letter-spacing: 0.04em;
  line-height: 1;
}

h1 span { color: var(--accent); }

main {
  position: relative;
  z-index: 1;
  max-width: 640px;
  margin: 0 auto;
  padding: 32px 16px 80px;
}

.tabs { display: flex; gap: 8px; margin-bottom: 28px; }

.tab {
  flex: 1;
  padding: 11px 6px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  cursor: pointer;
}

.tab.active {
  background: var(--accent);
  color: #050508;
  border-color: var(--accent);
}

.tab-content { display: none; }
.tab-content.active { display: block; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 16px;
}

.card-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 0.05em;
  margin-bottom: 16px;
}

label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 7px;
  display:block;
}

input, select, textarea {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 14px;
  margin-bottom: 12px;
}

textarea { min-height: 60px; }

button {
  width: 100%;
  background: var(--accent);
  color: #050508;
  border: none;
  border-radius: 10px;
  padding: 13px;
  font-weight: 700;
  cursor: pointer;
}

.tx-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
}

.tx-top {
  display:flex;
  gap:8px;
  margin-bottom:8px;
}

.tx-badge {
  font-size: 10px;
  padding: 3px 9px;
  border-radius: 99px;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--border);
}

.tx-date {
  font-size: 11px;
  color: var(--muted);
}
</style>
</head>

<body>

<header>
  <div class="eyebrow">League Activity</div>
  <h1>RRL <span>Transactions</span></h1>
</header>

<main>

<div class="tabs">
  <div class="tab active" data-tab="log">Transactions</div>
  <div class="tab" data-tab="commish">Commish</div>
</div>

<!-- PUBLIC -->
<div id="tab-log" class="tab-content active">
  <div id="tx-list"></div>
</div>

<!-- COMMISH -->
<div id="tab-commish" class="tab-content">

  <div class="card">
    <div class="card-title">Commissioner Login</div>
    <input type="password" id="cx-pw" placeholder="Password">
    <button id="login">Login</button>
  </div>

  <div id="panel" style="display:none;">
    <div class="card">
      <div class="card-title">Log Transaction</div>

      <label>Type</label>
      <select id="type">
        <option value="trade">Trade</option>
        <option value="waiver">Waiver</option>
        <option value="retire">Retirement</option>
        <option value="other">Other</option>
      </select>

      <label>Description</label>
      <textarea id="desc"></textarea>

      <label>Notes</label>
      <input id="notes">

      <button id="submit">Post</button>
    </div>
  </div>

</div>

</main>

<script>

const sb = supabase.createClient(
'https://orreqxjbzqcjrzuazpco.supabase.co',
'YOUR_ANON_KEY'
);

// 🔐 UPDATED PASSWORD
const PASS = "RRL2026";

let logged = false;

// TAB SWITCH
document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("tab-"+t.dataset.tab).classList.add("active");
  };
});

// LOGIN
document.getElementById("login").onclick=()=>{
  if(document.getElementById("cx-pw").value!==PASS){
    alert("Wrong password");
    return;
  }
  logged=true;
  document.getElementById("panel").style.display="block";
};

// LOAD
async function load(){
  const {data}=await sb.from("transactions")
    .select("*")
    .order("created_at",{ascending:false});

  document.getElementById("tx-list").innerHTML = data.map(t=>`
    <div class="tx-item">
      <div class="tx-top">
        <span class="tx-badge">${t.type}</span>
        <span class="tx-date">${new Date(t.created_at).toLocaleDateString()}</span>
      </div>
      <div>${t.description||""}</div>
    </div>
  `).join("");
}

load();

// POST
document.getElementById("submit").onclick=async()=>{
  await sb.from("transactions").insert({
    type:document.getElementById("type").value,
    description:document.getElementById("desc").value,
    notes:document.getElementById("notes").value,
    created_at:new Date().toISOString()
  });

  document.getElementById("desc").value="";
  document.getElementById("notes").value="";

  load();
};

</script>

</body>
</html>
