<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRL – Transactions</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050508;
  --card:#13131c;
  --border:#1e1e2e;
  --accent:#00e5ff;
  --muted:#6b6b80;
}

body{
  margin:0;
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:white;
}

header{
  text-align:center;
  padding:40px 20px 20px;
  border-bottom:1px solid var(--border);
}

h1{
  font-family:'Bebas Neue';
  font-size:60px;
  color:var(--accent);
}

main{
  max-width:700px;
  margin:0 auto;
  padding:30px 16px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  margin-bottom:14px;
}

input,select,textarea{
  width:100%;
  margin-top:6px;
  margin-bottom:12px;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0a0a0f;
  color:white;
}

button{
  width:100%;
  padding:12px;
  background:var(--accent);
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  color:#000;
}

.tx{
  background:#0a0a0f;
  border:1px solid var(--border);
  padding:14px;
  border-radius:10px;
  margin-bottom:10px;
}

.badge{
  font-size:10px;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:6px;
}

.small{
  color:var(--muted);
  font-size:12px;
}

.section-title{
  font-size:14px;
  color:var(--muted);
  margin:20px 0 10px;
  letter-spacing:0.1em;
  text-transform:uppercase;
}
</style>
</head>

<body>

<header>
  <h1>RRL TRANSACTIONS</h1>
</header>

<main>

<!-- 🔥 PUBLIC FEED -->
<div class="section-title">Public Feed</div>
<div id="feed"></div>

<!-- 🔒 COMMISH LOGIN -->
<div class="section-title">Commissioner Panel</div>

<div class="card">
  <input type="password" id="pw" placeholder="Enter password">
  <button id="login">Login</button>
</div>

<!-- COMMISH PANEL -->
<div id="panel" style="display:none;">

  <div class="card">
    <h3 style="margin-bottom:10px;">Post Trade</h3>

    <label>Team A</label>
    <select id="teamA"></select>

    <label>Team B</label>
    <select id="teamB"></select>

    <label>Description</label>
    <textarea id="desc" placeholder="What happened in this trade?"></textarea>

    <label>Notes</label>
    <input id="notes" placeholder="Optional notes">

    <button id="post">Post Transaction</button>
  </div>

</div>

</main>

<script>

const sb = supabase.createClient(
  "https://orreqxjbzqcjrzuazpco.supabase.co",
  "YOUR_ANON_KEY"
);

// 🔥 NEW RRL TEAMS
const TEAMS = [
  "Wolves","Stuntmen","Beasts","Falcons","Reapers","Patriots",
  "Triple T Elite","Fatties","Judy Hopps FC","Sour Patch Kids","La Familia","Predators"
];

const PASS = "RRL2026";
let logged = false;

// LOGIN
document.getElementById("login").onclick = () => {
  if(document.getElementById("pw").value !== PASS){
    alert("Wrong password");
    return;
  }

  logged = true;
  document.getElementById("panel").style.display = "block";

  const opts = TEAMS.map(t => `<option>${t}</option>`).join("");
  document.getElementById("teamA").innerHTML = opts;
  document.getElementById("teamB").innerHTML = opts;
};

// POST TRADE
document.getElementById("post").onclick = async () => {

  const teamA = document.getElementById("teamA").value;
  const teamB = document.getElementById("teamB").value;
  const desc = document.getElementById("desc").value;
  const notes = document.getElementById("notes").value;

  if(teamA === teamB){
    alert("Teams must be different");
    return;
  }

  await sb.from("transactions").insert({
    type:"trade",
    team_a:teamA,
    team_b:teamB,
    description:`${teamA} ⇄ ${teamB} — ${desc}`,
    notes,
    created_at:new Date().toISOString()
  });

  document.getElementById("desc").value="";
  document.getElementById("notes").value="";

  load();
};

// LOAD PUBLIC FEED
async function load(){
  const {data} = await sb.from("transactions")
    .select("*")
    .order("created_at",{ascending:false});

  document.getElementById("feed").innerHTML = data.map(t => `
    <div class="tx">
      <div class="badge">${t.type}</div>
      <div><b>${t.team_a || ""}</b> ⇄ <b>${t.team_b || ""}</b></div>
      <div class="small">${t.description || ""}</div>
      ${t.notes ? `<div class="small">Note: ${t.notes}</div>` : ""}
    </div>
  `).join("");
}

load();

</script>

</body>
</html>
