<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRL – Transactions</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:#050508;
  --card:#13131c;
  --border:#1e1e2e;
  --accent:#00e5ff;
  --muted:#6b6b80;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
  background:var(--bg);
  color:white;
  font-family:'DM Sans',sans-serif;
}

header{
  text-align:center;
  padding:40px 24px 20px;
  border-bottom:1px solid var(--border);
}

h1{
  font-family:'Bebas Neue';
  font-size:60px;
  color:var(--accent);
}

main{
  max-width:640px;
  margin:0 auto;
  padding:32px 16px 80px;
}

.tabs{display:flex;gap:8px;margin-bottom:28px;}

.tab{
  flex:1;
  padding:11px;
  text-align:center;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  cursor:pointer;
}

.tab.active{
  background:var(--accent);
  color:#000;
  border-color:var(--accent);
}

.tab-content{display:none;}
.tab-content.active{display:block;}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  margin-bottom:14px;
}

input,select,textarea{
  width:100%;
  margin-top:6px;
  margin-bottom:12px;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#0a0a0f;
  color:white;
}

button{
  width:100%;
  padding:12px;
  background:var(--accent);
  border:none;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  color:#000;
}

.tx{
  background:#0a0a0f;
  border:1px solid var(--border);
  padding:14px;
  border-radius:10px;
  margin-bottom:10px;
}

.badge{
  font-size:10px;
  text-transform:uppercase;
  color:var(--accent);
}

.small{
  color:var(--muted);
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <h1>RRL TRANSACTIONS</h1>
</header>

<main>

<!-- PUBLIC FEED -->
<div class="tab-content active" id="tab-log">
  <div id="tx-list"></div>
</div>

<!-- COMMISH -->
<div class="tab-content" id="tab-commish">

  <div class="card">
    <input type="password" id="pw" placeholder="Enter password">
    <button id="login">Login</button>
  </div>

  <div id="panel" style="display:none;">

    <div class="card">
      <h3>Log Trade</h3>

      <label>Team A</label>
      <select id="teamA"></select>

      <label>Team B</label>
      <select id="teamB"></select>

      <label>Description</label>
      <textarea id="desc" placeholder="Trade details..."></textarea>

      <label>Notes</label>
      <input id="notes" placeholder="Optional notes">

      <button id="post">Post Transaction</button>
    </div>

  </div>

</div>

</main>

<script>

const sb = supabase.createClient(
  'https://orreqxjbzqcjrzuazpco.supabase.co',
  'YOUR_ANON_KEY'
);

// 🔥 RRL TEAMS (UPDATED SET)
const TEAMS = [
  "Wolves",
  "Stuntmen",
  "Beasts",
  "Falcons",
  "Reapers",
  "Patriots",
  "Outlaws",
  "Titans",
  "Vipers",
  "Kings",
  "Shadows",
  "Renegades"
];

// 🔐 UPDATED PASSWORD
const PASS = "RRL2026";

let logged = false;

// LOGIN
document.getElementById("login").onclick = () => {
  if(document.getElementById("pw").value !== PASS){
    alert("Wrong password");
    return;
  }

  logged = true;
  document.getElementById("panel").style.display = "block";

  const opts = TEAMS.map(t => `<option>${t}</option>`).join("");
  document.getElementById("teamA").innerHTML = opts;
  document.getElementById("teamB").innerHTML = opts;
};

// POST
document.getElementById("post").onclick = async () => {

  const teamA = document.getElementById("teamA").value;
  const teamB = document.getElementById("teamB").value;
  const desc = document.getElementById("desc").value;
  const notes = document.getElementById("notes").value;

  if(teamA === teamB){
    alert("Teams must be different");
    return;
  }

  await sb.from("transactions").insert({
    type:"trade",
    team_a:teamA,
    team_b:teamB,
    description:`${teamA} ⇄ ${teamB} — ${desc}`,
    notes,
    created_at:new Date().toISOString()
  });

  document.getElementById("desc").value="";
  document.getElementById("notes").value="";

  load();
};

// LOAD FEED
async function load(){
  const {data}=await sb.from("transactions")
    .select("*")
    .order("created_at",{ascending:false});

  document.getElementById("tx-list").innerHTML =
  data.map(t=>`
    <div class="tx">
      <div class="badge">${t.type}</div>
      <div><b>${t.team_a||""}</b> ⇄ <b>${t.team_b||""}</b></div>
      <div class="small">${t.description||""}</div>
    </div>
  `).join("");
}

load();

</script>

</body>
</html>
