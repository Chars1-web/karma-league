<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RRL – Transactions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #050508;
      --card: #13131c;
      --border: #1e1e2e;
      --accent: #00e5ff;
      --accent2: #ff3c6e;
      --text: #f0f0f0;
      --muted: #6b6b80;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      padding: 40px 24px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(36px,8vw,72px);
      letter-spacing: 0.04em;
    }

    h1 span { color: var(--accent); }

    main {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 16px 80px;
    }

    .tabs { display:flex; gap:8px; margin-bottom:28px; }

    .tab {
      flex:1;
      padding:11px;
      text-align:center;
      font-size:12px;
      font-weight:700;
      text-transform:uppercase;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--card);
      color:var(--muted);
      cursor:pointer;
    }

    .tab.active {
      background:var(--accent);
      color:#050508;
      border-color:var(--accent);
    }

    .tab-content { display:none; }
    .tab-content.active { display:block; }

    .card {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:22px;
      margin-bottom:16px;
    }

    .card-title {
      font-family:'Bebas Neue';
      font-size:22px;
      margin-bottom:14px;
      letter-spacing:0.05em;
    }

    input, select, textarea {
      width:100%;
      padding:11px 14px;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--bg);
      color:var(--text);
      margin-bottom:10px;
    }

    textarea { min-height:70px; }

    .btn {
      width:100%;
      padding:13px;
      border:none;
      border-radius:10px;
      background:var(--accent);
      font-weight:700;
      cursor:pointer;
      color:#050508;
    }

    .tx-item {
      background:var(--bg);
      border:1px solid var(--border);
      border-radius:12px;
      padding:14px;
      margin-bottom:10px;
    }

    .tx-top {
      display:flex;
      justify-content:space-between;
      margin-bottom:8px;
    }

    .tx-badge {
      font-size:10px;
      padding:3px 9px;
      border-radius:99px;
      border:1px solid var(--border);
      color:var(--accent);
      text-transform:uppercase;
    }

    .tx-date {
      font-size:11px;
      color:var(--muted);
    }
  </style>
</head>

<body>

<header>
  <div class="eyebrow">League Activity</div>
  <h1>RRL <span>Transactions</span></h1>
</header>

<main>

  <div class="tabs">
    <div class="tab active" data-tab="log">Transactions</div>
    <div class="tab" data-tab="commish">Commish</div>
  </div>

  <!-- LOG -->
  <div id="tab-log" class="tab-content active">
    <div id="tx-list"></div>
  </div>

  <!-- COMMISH -->
  <div id="tab-commish" class="tab-content">

    <div class="card">
      <div class="card-title">Commissioner Login</div>
      <input type="password" id="pw" placeholder="Password">
      <button class="btn" id="login">Login</button>
    </div>

    <div id="panel" style="display:none;">
      <div class="card">
        <div class="card-title">Log Transaction</div>

        <select id="type">
          <option value="trade">Trade</option>
          <option value="waiver">Waiver</option>
          <option value="retire">Retirement</option>
          <option value="other">Other</option>
        </select>

        <textarea id="desc" placeholder="Description"></textarea>
        <input id="notes" placeholder="Notes (optional)">

        <button class="btn" id="submit">Post</button>
      </div>
    </div>

  </div>

</main>

<script>
const sb = supabase.createClient(
  'https://orreqxjbzqcjrzuazpco.supabase.co',
  'YOUR_ANON_KEY'
);

const PASS = "comm101";
let logged = false;

document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("tab-"+t.dataset.tab).classList.add("active");
  };
});

document.getElementById("login").onclick=()=>{
  if(document.getElementById("pw").value!==PASS) return alert("Wrong password");
  logged=true;
  document.getElementById("panel").style.display="block";
};

async function load(){
  const {data}=await sb.from("transactions").select("*").order("created_at",{ascending:false});
  const el=document.getElementById("tx-list");

  if(!data?.length){
    el.innerHTML = "<p style='color:#6b6b80;text-align:center;'>No transactions yet.</p>";
    return;
  }

  el.innerHTML=data.map(t=>`
    <div class="tx-item">
      <div class="tx-top">
        <span class="tx-badge">${t.type}</span>
        <span class="tx-date">${new Date(t.created_at).toLocaleDateString()}</span>
      </div>
      <div>${t.description || ""}</div>
      ${t.notes ? `<div style="color:#6b6b80;font-size:12px;margin-top:6px;">${t.notes}</div>` : ""}
    </div>
  `).join("");
}

load();

document.getElementById("submit").onclick=async()=>{
  if(!logged) return alert("Login first");

  const payload = {
    type: document.getElementById("type").value,
    description: document.getElementById("desc").value,
    notes: document.getElementById("notes").value,
    created_at: new Date().toISOString()
  };

  await sb.from("transactions").insert(payload);

  document.getElementById("desc").value="";
  document.getElementById("notes").value="";

  load();
};
</script>

</body>
</html>
