<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RRL — Rosters</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#07080c;
  --card:#11131b;
  --border:#1d2230;
  --accent:#e8ff3c;
  --text:#f5f5f5;
  --muted:#8a8fa3;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  padding:30px 16px;
}

header{
  text-align:center;
  margin-bottom:30px;
}

h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:54px;
  letter-spacing:2px;
}

h1 span{color:var(--accent);}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:14px;
  max-width:1200px;
  margin:auto;
}

/* TEAM CARD */
.team{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
}

.team-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  border-bottom:1px solid var(--border);
  padding-bottom:8px;
}

.team-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:24px;
}

.gm{
  font-size:11px;
  color:var(--accent);
  font-weight:700;
}

/* PLAYERS */
.player{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,0.04);
  font-size:13px;
}

.player:last-child{border-bottom:none;}

.username{
  font-weight:600;
}

.badge{
  font-size:11px;
  color:var(--muted);
}

/* LINKS */
a{
  color:inherit;
  text-decoration:none;
}

a:hover{
  color:var(--accent);
}

.loading{
  text-align:center;
  color:var(--muted);
}
</style>
</head>

<body>

<header>
  <h1>RRL <span>Rosters</span></h1>
  <div class="sub">Click players or GMs to view profiles</div>
</header>

<div id="roster" class="grid">

/* =========================

========================= */

function render(){

  const container = document.getElementById("roster");
  container.innerHTML = "";

  Object.keys(teams).forEach(teamName => {

    const team = teams[teamName];

    const gmLink = encodeURIComponent(team.gm);

    const playersHTML = team.players.map(p => {

      const safe = encodeURIComponent(p);

      return `
        <div class="player">
          <div class="username">
            <a href="profile.html?user=${safe}">${p}</a>
          </div>
          <div class="badge">Player</div>
        </div>
      `;

    }).join("");

    container.innerHTML += `
      <div class="team">

        <div class="team-header">

          <div class="team-name">${teamName}</div>

          <div class="gm">
            <a href="profile.html?user=${gmLink}">
              GM @${team.gm}
            </a>
          </div>

        </div>

        ${playersHTML}

      </div>
    `;

  });

}
