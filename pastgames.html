<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RRL – Past Games</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050508;
  --card:#13131c;
  --border:#1e1e2e;
  --accent:#00e5ff;
  --text:#f0f0f0;
  --muted:#6b6b80;
  --win:#00ff88;
  --error:#ff4444;
}

body{
  margin:0;
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  text-align:center;
  padding:40px 20px 20px;
  border-bottom:1px solid var(--border);
}

h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:60px;
  margin:0;
}

h1 span{
  color:var(--accent);
}

.tabs{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:20px;
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}

.tab-btn{
  background:none;
  border:none;
  color:var(--muted);
  font-size:14px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  cursor:pointer;
  padding:8px 16px;
  border-bottom:2px solid transparent;
}

.tab-btn.active{
  color:var(--accent);
  border-bottom-color:var(--accent);
}

.tab-content{
  display:none;
}

.tab-content.active{
  display:block;
}

main{
  max-width:800px;
  margin:0 auto;
  padding:30px 16px;
}

.game{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
  position:relative;
}

.game-delete-btn{
  position:absolute;
  top:12px;
  right:12px;
  padding:8px 12px;
  background:rgba(255,68,68,0.2);
  border:1px solid var(--error);
  border-radius:6px;
  color:var(--error);
  cursor:pointer;
  font-size:11px;
  display:none;
}

.game.show-delete .game-delete-btn{
  display:block;
}

.matchday{
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
  font-weight:700;
}

.matchup{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:12px;
  align-items:center;
}

.team{
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
}

.team-name{
  font-weight:700;
  margin-bottom:8px;
  font-size:15px;
}

.total{
  font-weight:700;
  color:var(--accent);
}

.vs{
  font-weight:900;
  color:var(--muted);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:40px 0;
}

.form-section{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  margin-bottom:20px;
}

.form-section h3{
  font-family:'Bebas Neue',sans-serif;
  font-size:22px;
  margin:0 0 16px;
  color:var(--accent);
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:8px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:12px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  font-size:14px;
  box-sizing:border-box;
}

.button-group{
  display:flex;
  gap:12px;
}

.btn-submit,
.btn-cancel{
  flex:1;
  padding:14px;
  border-radius:8px;
  font-weight:700;
  text-transform:uppercase;
  cursor:pointer;
  border:none;
}

.btn-submit{
  background:var(--accent);
  color:var(--bg);
}

.btn-cancel{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
}

.message{
  padding:16px;
  border-radius:8px;
  margin-bottom:16px;
  font-weight:700;
}

.message.success{
  background:rgba(0,255,136,0.15);
  border:1px solid var(--win);
  color:var(--win);
}

.message.error{
  background:rgba(255,68,68,0.15);
  border:1px solid var(--error);
  color:var(--error);
}

.message.loading{
  background:rgba(0,229,255,0.15);
  border:1px solid var(--accent);
  color:var(--accent);
}
</style>
</head>

<body>

<header>
  <h1>RRL <span>Games</span></h1>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab(event,'games')">Past Games</button>
  <button class="tab-btn" onclick="switchTab(event,'add')">Add Game</button>
</div>

<div id="games" class="tab-content active">
  <main id="gamesList">
    <div class="empty">Loading games...</div>
  </main>

  <div style="text-align:center;padding-bottom:30px;">
    <button id="toggleDeleteBtn"
      onclick="toggleDeleteMode()"
      style="padding:10px 20px;background:transparent;border:1px solid var(--muted);border-radius:8px;color:var(--muted);cursor:pointer;font-weight:700;">
      🔐 Lock
    </button>
  </div>
</div>

<div id="add" class="tab-content">
  <main>

    <div id="passwordPrompt" class="form-section" style="text-align:center;">
      <h3>Commissioner Access</h3>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          id="commishPassword"
          placeholder="Enter password"
          onkeypress="if(event.key==='Enter')verifyPassword()"
        >
      </div>

      <button class="btn-submit" onclick="verifyPassword()">Unlock</button>

      <div id="passwordError"
        style="display:none;color:#ff4444;margin-top:12px;">
        Incorrect password
      </div>
    </div>

    <div id="gameForm" style="display:none;">

      <div id="message"></div>

      <div class="form-section">
        <h3>Team 1</h3>

        <div class="form-group">
          <label>Select Team</label>
          <select id="team1Name">
            <option value="">Choose a team...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Score</label>
          <input type="number" id="team1Total" min="0">
        </div>
      </div>

      <div class="form-section">
        <h3>Team 2</h3>

        <div class="form-group">
          <label>Select Team</label>
          <select id="team2Name">
            <option value="">Choose a team...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Score</label>
          <input type="number" id="team2Total" min="0">
        </div>
      </div>

      <div class="button-group">
        <button class="btn-submit" id="submitBtn" onclick="submitGame()">
          Submit Game
        </button>

        <button class="btn-cancel" onclick="resetForm()">
          Clear
        </button>
      </div>

    </div>

  </main>
</div>

<script>
const sb = window.supabase.createClient(
  'https://orreqxjbzqcjrzuazpco.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ycmVxeGpienFjanJ6dWF6cGNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMjU0OTYsImV4cCI6MjA4OTgwMTQ5Nn0.Ew5tD42tqmNMa0Ctf14QoD9UFI1ElGE-Zk0cCdwAoVE'
);

function switchTab(event,tab){
  document.querySelectorAll('.tab-content')
    .forEach(el=>el.classList.remove('active'));

  document.querySelectorAll('.tab-btn')
    .forEach(el=>el.classList.remove('active'));

  document.getElementById(tab).classList.add('active');
  event.target.classList.add('active');
}

function verifyPassword(){
  const password = document.getElementById('commishPassword').value;

  if(password === 'RRL2026'){
    document.getElementById('passwordPrompt').style.display='none';
    document.getElementById('gameForm').style.display='block';
    document.getElementById('passwordError').style.display='none';
  }else{
    document.getElementById('passwordError').style.display='block';
  }
}

function showMessage(msg,type=''){
  const el = document.getElementById('message');

  if(!msg){
    el.innerHTML='';
    return;
  }

  el.className='message '+type;
  el.innerText=msg;
}

function resetForm(){
  document.getElementById('team1Name').value='';
  document.getElementById('team1Total').value='';
  document.getElementById('team2Name').value='';
  document.getElementById('team2Total').value='';
}

async function submitGame(){

  const team1Name = document.getElementById('team1Name').value;
  const team2Name = document.getElementById('team2Name').value;

  const score1 = document.getElementById('team1Total').value;
  const score2 = document.getElementById('team2Total').value;

  if(!team1Name || !team2Name){
    showMessage('Select both teams','error');
    return;
  }

  if(team1Name === team2Name){
    showMessage('Teams must be different','error');
    return;
  }

  if(score1 === '' || score2 === ''){
    showMessage('Enter both scores','error');
    return;
  }

  showMessage('Submitting game...','loading');

  const { error } = await sb
    .from('Games')
    .insert([
      {
        Team_a: team1Name,
        Team_b: team2Name,
        score_a: Number(score1),
        score_b: Number(score2),
        matchday: 'Matchday',
        created_at: new Date().toISOString()
      }
    ]);

  if(error){
    showMessage(error.message,'error');
    return;
  }

  showMessage('Game submitted!','success');

  resetForm();

  setTimeout(()=>{
    loadGames();
    document.querySelector('[onclick="switchTab(event,\'games\')"]').click();
  },500);
}

async function loadGames(){

  const el = document.getElementById('gamesList');

  const { data,error } = await sb
    .from('Games')
    .select('*')
    .order('created_at',{ascending:false});

  if(error){
    el.innerHTML=`<div class="empty">${error.message}</div>`;
    return;
  }

  if(!data.length){
    el.innerHTML='<div class="empty">No games yet</div>';
    return;
  }

  el.innerHTML = data.map(g=>`
    <div class="game" data-game-id="${g.id}">

      <button class="game-delete-btn"
        onclick="deleteGame('${g.id}')">
        Delete
      </button>

      <div class="matchday">${g.matchday || 'Matchday'}</div>

      <div class="matchup">

        <div class="team">
          <div class="team-name">${g.Team_a}</div>
          <div class="total">Total: ${g.score_a}</div>
        </div>

        <div class="vs">VS</div>

        <div class="team">
          <div class="team-name">${g.Team_b}</div>
          <div class="total">Total: ${g.score_b}</div>
        </div>

      </div>

    </div>
  `).join('');
}

async function deleteGame(gameId){

  if(!confirm('Delete this game?')) return;

  const { error } = await sb
    .from('Games')
    .delete()
    .eq('id',gameId);

  if(error){
    alert(error.message);
    return;
  }

  loadGames();
}

let deleteMode = false;

function toggleDeleteMode(){

  deleteMode = !deleteMode;

  const btn = document.getElementById('toggleDeleteBtn');

  document.querySelectorAll('.game')
    .forEach(game=>{
      game.classList.toggle('show-delete');
    });

  if(deleteMode){
    btn.innerText='🔓 Unlock';
    btn.style.color='var(--error)';
    btn.style.borderColor='var(--error)';
  }else{
    btn.innerText='🔐 Lock';
    btn.style.color='var(--muted)';
    btn.style.borderColor='var(--muted)';
  }
}

function loadTeams(){

  const teams = [
    "Dinos 🦖",
    "Commies ⚒️",
    "Lions 🦁",
    "Villains 🦹",
    "Reapers 💀",
    "Knights 🛡️",
    "Penguins 🐧",
    "Snakes 🐍",
    "Goats 🐐",
    "Bay Stars ✨",
    "Kraken 🐙",
    "Gators 🐊",
    "Rangers 🤺",
    "Polar Bears 🐻‍❄️",
    "Sharks 🦈",
    "Titans ⚔️"
  ];

  const team1 = document.getElementById('team1Name');
  const team2 = document.getElementById('team2Name');

  teams.forEach(team=>{

    const option1 = document.createElement('option');
    option1.value=team;
    option1.textContent=team;
    team1.appendChild(option1);

    const option2 = document.createElement('option');
    option2.value=team;
    option2.textContent=team;
    team2.appendChild(option2);

  });
}

loadGames();
loadTeams();
</script>

</body>
</html>
