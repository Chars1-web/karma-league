<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RRL – Past Games</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --bg:#050508;
    --card:#13131c;
    --border:#1e1e2e;
    --accent:#00e5ff;
    --text:#f0f0f0;
    --muted:#6b6b80;
    --win:#00ff88;
    --error:#ff4444;
  }

  body {
    margin:0;
    font-family:'DM Sans', sans-serif;
    background:var(--bg);
    color:var(--text);
  }

  header {
    text-align:center;
    padding:40px 20px 20px;
    border-bottom:1px solid var(--border);
  }

  h1 {
    font-family:'Bebas Neue', sans-serif;
    font-size:60px;
    margin:0;
  }

  h1 span { color:var(--accent); }

  /* Tab Navigation */
  .tabs {
    display:flex;
    justify-content:center;
    gap:20px;
    padding:20px;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }

  .tab-btn {
    background:none;
    border:none;
    color:var(--muted);
    font-family:'DM Sans', sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    padding:8px 16px;
    border-bottom:2px solid transparent;
    transition:all 0.3s ease;
  }

  .tab-btn:hover {
    color:var(--accent);
  }

  .tab-btn.active {
    color:var(--accent);
    border-bottom-color:var(--accent);
  }

  /* Tab Content */
  .tab-content {
    display:none;
  }

  .tab-content.active {
    display:block;
  }

  main {
    max-width:800px;
    margin:0 auto;
    padding:30px 16px;
  }

  /* Games Tab Styles */
  .game {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    margin-bottom:14px;
    position:relative;
  }

  .game-delete-btn {
    position:absolute;
    top:12px;
    right:12px;
    padding:8px 12px;
    background:rgba(255,68,68,0.2);
    border:1px solid var(--error);
    border-radius:6px;
    color:var(--error);
    cursor:pointer;
    font-weight:600;
    font-size:11px;
    transition:all 0.2s ease;
    display:none;
  }

  .game-delete-btn:hover {
    background:rgba(255,68,68,0.3);
  }

  .game.show-delete .game-delete-btn {
    display:block;
  }

  .matchday {
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:10px;
    font-weight:700;
  }

  .matchup {
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:12px;
    align-items:start;
  }

  .team {
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
  }

  .team-name {
    font-weight:700;
    margin-bottom:8px;
    font-size:15px;
  }

  .player {
    font-size:12px;
    color:var(--muted);
    margin:2px 0;
  }

  .total {
    margin-top:8px;
    font-weight:700;
    color:var(--accent);
  }

  .vs {
    font-weight:900;
    color:var(--muted);
    align-self:center;
  }

  .empty {
    text-align:center;
    color:var(--muted);
    padding:40px 0;
  }

  /* Add Game Form Styles */
  .form-section {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:24px;
    margin-bottom:20px;
  }

  .form-section h3 {
    font-family:'Bebas Neue', sans-serif;
    font-size:20px;
    margin:0 0 16px 0;
    color:var(--accent);
  }

  .form-group {
    margin-bottom:16px;
  }

  .form-group label {
    display:block;
    font-size:12px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }

  .form-group input,
  .form-group textarea {
    width:100%;
    padding:12px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-family:'DM Sans', sans-serif;
    font-size:14px;
    box-sizing:border-box;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    outline:none;
    border-color:var(--accent);
    background:rgba(0,229,255,0.05);
  }

  .form-group textarea {
    resize:vertical;
    min-height:100px;
  }

  .button-group {
    display:flex;
    gap:12px;
    margin-top:24px;
  }

  .btn-submit {
    flex:1;
    padding:14px;
    background:var(--accent);
    border:none;
    border-radius:8px;
    color:var(--bg);
    font-weight:700;
    font-family:'DM Sans', sans-serif;
    text-transform:uppercase;
    cursor:pointer;
    transition:all 0.2s ease;
  }

  .btn-submit:hover {
    opacity:0.9;
  }

  .btn-submit:disabled {
    opacity:0.5;
    cursor:not-allowed;
  }

  .btn-cancel {
    flex:1;
    padding:14px;
    background:transparent;
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-weight:700;
    font-family:'DM Sans', sans-serif;
    text-transform:uppercase;
    cursor:pointer;
    transition:all 0.2s ease;
  }

  .btn-cancel:hover {
    border-color:var(--accent);
    color:var(--accent);
  }

  .message {
    padding:16px;
    border-radius:8px;
    margin-bottom:16px;
    font-weight:600;
  }

  .message.success {
    background:rgba(0,255,136,0.15);
    border:1px solid var(--win);
    color:var(--win);
  }

  .message.error {
    background:rgba(255,68,68,0.15);
    border:1px solid var(--error);
    color:var(--error);
  }

  .message.loading {
    background:rgba(0,229,255,0.15);
    border:1px solid var(--accent);
    color:var(--accent);
  }
</style>
</head>

<body>

<header>
  <h1>RRL <span>Games</span></h1>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('games')">Past Games</button>
  <button class="tab-btn" onclick="switchTab('add')">Add Game</button>
</div>

<!-- Games Tab -->
<div id="games" class="tab-content active">
  <main id="gamesList">
    <div class="empty">Loading games...</div>
  </main>
  <div style="text-align:center; padding:20px;">
    <button class="btn-secondary" id="toggleDeleteBtn" onclick="toggleDeleteMode()" style="padding:10px 20px; background:transparent; border:1px solid var(--muted); border-radius:8px; color:var(--muted); cursor:pointer; font-weight:600; font-size:12px; font-family:'DM Sans', sans-serif; text-transform:uppercase; transition:all 0.2s ease; margin-top:10px;">
      🔐 Lock
    </button>
  </div>
</div>

<!-- Add Game Tab -->
<div id="add" class="tab-content">
  <main>
    <div id="passwordPrompt" class="form-section" style="text-align:center;">
      <h3 style="margin-bottom:20px;">Commissioner Access</h3>
      <div class="form-group">
        <label>Enter Password</label>
        <input type="password" id="commishPassword" placeholder="Enter password" onkeypress="if(event.key==='Enter') verifyPassword()">
      </div>
      <button class="btn-submit" onclick="verifyPassword()">Unlock</button>
      <div id="passwordError" style="color:#ff4444; margin-top:12px; display:none;">Incorrect password</div>
    </div>
    <div id="gameForm" style="display:none;">
    <div id="message"></div>
    
    <div class="form-section">
      <h3>Team 1</h3>
      <div class="form-group">
        <label>Select Team</label>
        <select id="team1Name" style="width:100%; padding:12px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'DM Sans', sans-serif; font-size:14px; cursor:pointer;">
          <option value="">Choose a team...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Team Score</label>
        <input type="number" id="team1Total" placeholder="Score" min="0">
      </div>
    </div>

    <div class="form-section">
      <h3>Team 2</h3>
      <div class="form-group">
        <label>Select Team</label>
        <select id="team2Name" style="width:100%; padding:12px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'DM Sans', sans-serif; font-size:14px; cursor:pointer;">
          <option value="">Choose a team...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Team Score</label>
        <input type="number" id="team2Total" placeholder="Score" min="0">
      </div>
    </div>

    <div class="button-group">
      <button class="btn-submit" id="submitBtn" onclick="submitGame()">Submit Game</button>
      <button class="btn-cancel" onclick="resetForm()">Clear</button>
    </div>
    </div>
  </main>
</div>

<script>
const sb = supabase.createClient(
  'https://orreqxjbzqcjrzuazpco.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ycmVxeGpiendxY2pyenVhenpwY28iLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcxNzU5OTc5MCwiZXhwIjoyMDMzMTc1NzkwfQ.sxP6GHwI1gA7k92R9vp4kzg7Ky9LmJOhnnH4Y5dYmQw'
);

// Tab Switching
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  
  document.getElementById(tab).classList.add('active');
  event.target.classList.add('active');
}

// Password Verification
function verifyPassword() {
  const password = document.getElementById('commishPassword').value;
  const errorEl = document.getElementById('passwordError');
  
  if (password === 'RRL2026') {
    document.getElementById('passwordPrompt').style.display = 'none';
    document.getElementById('gameForm').style.display = 'block';
    errorEl.style.display = 'none';
    document.getElementById('commishPassword').value = '';
  } else {
    errorEl.style.display = 'block';
    document.getElementById('commishPassword').value = '';
  }
}

// Reset Form
function resetForm() {
  document.getElementById('team1Name').value = '';
  document.getElementById('team1Total').value = '';
  document.getElementById('team2Name').value = '';
  document.getElementById('team2Total').value = '';
  
  showMessage('');
}

// Format game data
function formatGameData() {
  const team1Name = document.getElementById('team1Name').value.trim();
  const team2Name = document.getElementById('team2Name').value.trim();
  
  if (!team1Name || !team2Name) {
    showMessage('Please select both teams', 'error');
    return null;
  }

  if (team1Name === team2Name) {
    showMessage('Please select two different teams', 'error');
    return null;
  }

  const team1Total = document.getElementById('team1Total').value.trim();
  const team2Total = document.getElementById('team2Total').value.trim();

  if (!team1Total || !team2Total) {
    showMessage('Please enter scores for both teams', 'error');
    return null;
  }

  // Format: Team Name\nTotal: X 🆚 Team Name\nTotal: X
  const description = `${team1Name}
Total: ${team1Total} 🆚 ${team2Name}
Total: ${team2Total}`;

  return description;
}

// Submit Game
async function submitGame() {
  const btn = document.getElementById('submitBtn');
  const gameData = formatGameData();
  
  if (!gameData) return;

  btn.disabled = true;
  showMessage('Submitting game...', 'loading');

  const { error } = await sb
    .from('transactions')
    .insert([
      {
        type: 'game',
        description: gameData,
        created_at: new Date().toISOString()
      }
    ]);

  btn.disabled = false;

  if (error) {
    showMessage('Error submitting game: ' + error.message, 'error');
    return;
  }

  showMessage('Game submitted successfully!', 'success');
  resetForm();
  
  // Reload games after 1 second
  setTimeout(() => {
    loadGames();
    switchTab('games');
  }, 1000);
}

// Show Message
function showMessage(msg, type = '') {
  const el = document.getElementById('message');
  if (!msg) {
    el.innerHTML = '';
    return;
  }
  el.className = 'message ' + type;
  el.innerText = msg;
}

// Parse and Render Games
function parseGame(text) {
  const parts = text.split("🆚");
  if (parts.length < 2) return null;

  const left = parts[0].trim();
  const right = parts[1].trim();

  return { left, right };
}

function renderTeam(block) {
  const lines = block.trim().split("\n").filter(l => l.trim());

  const name = lines[0] || "Team";
  let players = [];
  let total = "";

  lines.slice(1).forEach(l => {
    if (l.toLowerCase().includes("total")) {
      total = l;
    } else {
      players.push(l);
    }
  });

  return `
    <div class="team">
      <div class="team-name">${name}</div>
      ${players.map(p => `<div class="player">${p}</div>`).join("")}
      <div class="total">${total}</div>
    </div>
  `;
}

async function loadGames() {
  const el = document.getElementById("gamesList");

  const { data, error } = await sb
    .from("transactions")
    .select("*")
    .eq("type", "game")
    .order("created_at", { ascending: false });

  if (error || !data) {
    el.innerHTML = `<div class="empty">Error loading games</div>`;
    return;
  }

  if (!data.length) {
    el.innerHTML = `<div class="empty">No past games yet</div>`;
    return;
  }

  el.innerHTML = data.map(g => {
    const parsed = parseGame(g.description || "");
    if (!parsed) {
      return `<div class="game" data-game-id="${g.id}">
        <button class="game-delete-btn" onclick="deleteGame('${g.id}')">Delete</button>
        ${g.description}
      </div>`;
    }

    return `
      <div class="game" data-game-id="${g.id}">
        <button class="game-delete-btn" onclick="deleteGame('${g.id}')">Delete</button>
        <div class="matchday">Matchday</div>
        <div class="matchup">
          ${renderTeam(parsed.left)}
          <div class="vs">VS</div>
          ${renderTeam(parsed.right)}
        </div>
      </div>
    `;
  }).join("");
}

// Load Teams
async function loadTeams() {
  const teams = [
    "Dinos 🦖",
    "Commies ⚒️",
    "Lions 🦁",
    "Villains 🦹",
    "Reapers 💀",
    "Knights 🛡️",
    "Penguins 🐧",
    "Snakes 🐍",
    "Goats 🐐",
    "Bay Stars ✨",
    "Kraken 🐙",
    "Gators 🐊",
    "Rangers 🤺",
    "Polar Bears 🐻‍❄️",
    "Sharks 🦈",
    "Titans ⚔️",
  ];

  // Populate both dropdowns
  const team1Select = document.getElementById('team1Name');
  const team2Select = document.getElementById('team2Name');

  teams.forEach(team => {
    const option1 = document.createElement('option');
    option1.value = team;
    option1.textContent = team;
    team1Select.appendChild(option1);

    const option2 = document.createElement('option');
    option2.value = team;
    option2.textContent = team;
    team2Select.appendChild(option2);
  });
}

// Toggle Delete Mode
let deleteMode = false;
function toggleDeleteMode() {
  deleteMode = !deleteMode;
  const btn = document.getElementById('toggleDeleteBtn');
  const games = document.querySelectorAll('.game');
  
  if (deleteMode) {
    btn.textContent = '🔓 Unlock';
    btn.style.color = 'var(--error)';
    btn.style.borderColor = 'var(--error)';
    games.forEach(game => game.classList.add('show-delete'));
  } else {
    btn.textContent = '🔐 Lock';
    btn.style.color = 'var(--muted)';
    btn.style.borderColor = 'var(--muted)';
    games.forEach(game => game.classList.remove('show-delete'));
  }
}

// Delete Game
async function deleteGame(gameId) {
  if (!confirm('Are you sure you want to delete this game?')) {
    return;
  }

  const { error } = await sb
    .from('transactions')
    .delete()
    .eq('id', gameId);

  if (error) {
    alert('Error deleting game: ' + error.message);
    return;
  }

  loadGames();
}

loadGames();
loadTeams();
</script>

</body>
</html>
